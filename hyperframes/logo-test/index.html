<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      :root {
        --ground: #fef7fe;
        --ink: #1e1650;
        --accent: #6e4ff0;
        --font-display: "Inter", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root {
        width: 100%; height: 100%;
        font-family: var(--font-display);
      }
      /* each clip is absolutely positioned by the runtime, so place them explicitly */
      #logo { position: absolute; left: 280px; top: 560px; width: 520px; }
      #title { position: absolute; left: 0; right: 0; top: 1080px; text-align: center; color: var(--ink); font-size: 132px; font-weight: 700; letter-spacing: -0.02em; }
      #tagline { position: absolute; left: 0; right: 0; top: 1260px; text-align: center; color: var(--accent); font-size: 46px; font-weight: 500; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1080" data-height="1920">
      <img id="logo" class="clip" src="assets/digipae-logo.png" data-start="0" data-duration="3" data-track-index="0" />
      <h1 id="title" class="clip" data-start="0" data-duration="3" data-track-index="1">Digipae</h1>
      <p id="tagline" class="clip" data-start="0" data-duration="3" data-track-index="2">Everyday payments, made easier.</p>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#logo", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.6)" }, 0.1);
      tl.fromTo("#title", { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.6);
      tl.fromTo("#tagline", { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.9);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
